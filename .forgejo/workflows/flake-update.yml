name: Update flake and Attic cache

on:
  schedule:
    - cron: "0 4 * * 1"
      timezone: Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: flake-update
  cancel-in-progress: false

env:
  ATTIC_SERVER: diffumist
  ATTIC_ENDPOINT: https://attic.diffumist.me
  ATTIC_CACHE: nixos-config
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true

jobs:
  update:
    runs-on: nix
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Install action runtime and cache clients
        run: |
          set -euo pipefail
          # Why: the nixos/nix runner image already provides curl in its default profile.
          nix profile add nixpkgs#nodejs_24 nixpkgs#attic-client
          # Why: JavaScript actions need the profile's Node runtime in later steps.
          echo "$HOME/.nix-profile/bin" >> "$FORGEJO_PATH"

      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Update flake inputs
        run: nix flake update

      - name: Configure Attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$ATTIC_TOKEN" ]]; then
            echo "ATTIC_TOKEN must be configured as a Forgejo Actions secret." >&2
            exit 1
          fi

          attic login --set-default \
            "$ATTIC_SERVER" \
            "$ATTIC_ENDPOINT" \
            "$ATTIC_TOKEN"
          # Why: cache creation is an explicit one-time administrative action.
          attic cache info "$ATTIC_SERVER:$ATTIC_CACHE"
          attic use "$ATTIC_SERVER:$ATTIC_CACHE"

      - name: Build and push CI systems
        run: |
          set -euo pipefail

          nix eval --raw .#lib.ciHostNames \
            --apply 'names: builtins.concatStringsSep "\n" (names ++ [ "" ])' \
            | while IFS= read -r host; do
                [[ -n "$host" ]] || continue
                system_path="$(
                  nix eval --raw \
                    ".#nixosConfigurations.${host}.config.system.build.toplevel"
                )"
                store_name="${system_path##*/}"
                store_hash="${store_name%%-*}"

                # Why: this workflow recursively uploaded any cached system output.
                if curl --fail --silent --head --output /dev/null \
                  "$ATTIC_ENDPOINT/$ATTIC_CACHE/$store_hash.narinfo"; then
                  echo "Cached $host ($system_path); skipping build"
                  continue
                fi

                paths_file="$RUNNER_TEMP/nix-cache-$host"
                build_log="$RUNNER_TEMP/nix-build-$host.log"
                push_log="$RUNNER_TEMP/attic-push-$host.log"

                echo "Build $host"
                # Why: successful builds should not flood the Forgejo log.
                if ! nix build --no-link --print-out-paths -L \
                  ".#nixosConfigurations.${host}.config.system.build.toplevel" \
                  > "$paths_file" 2> "$build_log"; then
                  echo "::error::Build $host failed; showing the last 120 lines."
                  tail -n 120 "$build_log"
                  exit 1
                fi
                echo "Built $host ($(wc -l < "$paths_file") output path(s))"

                echo "Push $host to Attic"
                if ! attic push --stdin \
                  "$ATTIC_SERVER:$ATTIC_CACHE" \
                  < "$paths_file" > "$push_log" 2>&1; then
                  echo "::error::Attic push for $host failed; showing the last 120 lines."
                  tail -n 120 "$push_log"
                  exit 1
                fi
                echo "Cached $host"
              done

      - name: Commit updated lock file
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            echo "flake.lock is already up to date."
            exit 0
          fi

          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.git.418.cat"
          git add flake.lock
          git commit -m "flake: update inputs"
          git push origin "HEAD:$FORGEJO_REF_NAME"
