name: Push Nix cache

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attic-cache-${{ github.ref }}
  cancel-in-progress: true

env:
  ATTIC_SERVER: diffumist
  ATTIC_ENDPOINT: https://attic.diffumist.me
  ATTIC_CACHE: nixos-config
  # Why: flake commands ignore env-based nixpkgs overrides unless evaluation is impure.
  NIXPKGS_ALLOW_INSECURE: "1"

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            trusted-users = root runner
            substituters = https://cache.nixos.org https://cache.numtide.com https://attic.xuyh0120.win/lantian
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=

      - name: Configure Attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          if [ -z "$ATTIC_TOKEN" ]; then
            echo "::warning::ATTIC_TOKEN is not set; builds will run without pushing to Attic."
            exit 0
          fi

          nix shell --impure --inputs-from . nixpkgs#attic-client -c attic login \
            --set-default \
            "$ATTIC_SERVER" \
            "$ATTIC_ENDPOINT" \
            "$ATTIC_TOKEN"
          nix shell --impure --inputs-from . nixpkgs#attic-client -c attic use "$ATTIC_SERVER:$ATTIC_CACHE"

      - name: Build systems
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          set -euo pipefail

          attic_args=()
          if [ -n "$ATTIC_TOKEN" ]; then
            attic_args=(--attic-cache "$ATTIC_SERVER:$ATTIC_CACHE")
          fi

          fast_build() {
            nix shell --impure --inputs-from . nixpkgs#nix-fast-build nixpkgs#attic-client -c nix-fast-build \
              --impure \
              --no-link \
              --skip-cached \
              --eval-workers 3 \
              --max-jobs 3 \
              --fail-fast \
              "$@" \
              "${attic_args[@]}"
          }

          fast_build \
            --flake .#colmenaHive.nodes \
            --select 'nodes: builtins.mapAttrs (_: node: node.config.system.build.toplevel) nodes'

          fast_build \
            --flake .#nixosConfigurations \
            --select 'configs: { hawkpoint = configs.hawkpoint.config.system.build.toplevel; }'
